<!doctype html>
<html lang="vi" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MeoArc — Email Intelligence Platform quản lý Gmail bằng LLM agent." />
    <title>MeoArc — Email Intelligence</title>

    <!-- ══ CHỮ ══════════════════════════════════════════════════════════════
         PANCHANG (Fontshare) — mặt chữ hiển thị. Hình học, chân chữ vuông, gần
         như không có độ tương phản nét: đúng giọng công nghệ trong mấy mẫu tham
         chiếu. Thay hẳn ba mặt serif cũ (Fraunces, Cormorant Garamond, Playfair
         Display) — chúng nói giọng biên tập/cổ điển, sai hẳn với thứ đang chạy.

         Bỏ ba font đó cũng nhẹ đi đáng kể: mỗi họ serif kèm nhiều nét dày, mà
         chúng chỉ dùng cho tiêu đề.

         Ghi chú về hai cái tên còn lại đã cân nhắc: NEOFOLIO là font thương mại,
         không có nguồn web hợp lệ để nhúng. SK-MODERNIST miễn phí nhưng chỉ phát
         hành dạng tệp tải về, phải tự host — làm được nhưng phải đưa tệp font vào
         repo và tự viết @font-face. Panchang có CDN chính chủ, giấy phép web rõ
         ràng, và cùng một giọng chữ. Nếu muốn dùng SK-Modernist thì nói, tôi tải
         tệp về và tự host.

         PHẢI nạp bằng <link> ở đây: đặt @import trong index.css thì Tailwind v4
         gộp file và đẩy nó xuống sau các rule → trình duyệt bỏ qua, font không tải. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=panchang@400,500,600,700,800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tránh nhấp nháy theme: set class trước khi React mount -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('meoarc-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
