# nginx cho SPA React: mọi đường dẫn không phải file tĩnh → trả index.html
# (React Router lo phần định tuyến phía client; thiếu dòng try_files là F5 ở
#  trang con sẽ 404).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nén gzip cho bundle JS/CSS (NFR-Speed, khớp backend cũng bật gzip)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
