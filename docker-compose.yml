# ╔══════════════════════════════════════════════════════════════════╗
# ║ docker-compose.yml — dựng CẢ HỆ bằng 1 lệnh (phần QA/DevOps)       ║
# ╠══════════════════════════════════════════════════════════════════╣
# ║ Chạy:      docker compose up --build                               ║
# ║   FE  → http://localhost:5173   ·  BE → http://localhost:8000     ║
# ║   Postgres trong container (dữ liệu giữ ở volume meoarc_pgdata).   ║
# ║ Kèm Redis: docker compose --profile redis up --build               ║
# ║   (nhớ đặt REDIS_URL=redis://redis:6379/0 trong backend/.env)      ║
# ║ Điều kiện: backend/.env có GOOGLE_CLIENT_ID/SECRET (+ AI_API_KEY   ║
# ║   nếu muốn chat AI). DATABASE_URL bị compose GHI ĐÈ trỏ vào db.    ║
# ║ LƯU Ý: MCP server (Claude Desktop) vẫn chạy TRÊN MÁY (stdio),      ║
# ║   không nằm trong compose — đúng bản chất kênh agent-native.       ║
# ╚══════════════════════════════════════════════════════════════════╝

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: meoarc_local
      POSTGRES_DB: meoarc
    volumes:
      - meoarc_pgdata:/var/lib/postgresql/data
    healthcheck:                       # backend chỉ khởi động khi DB THẬT SỰ sẵn sàng
      test: ["CMD-SHELL", "pg_isready -U postgres -d meoarc"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./src/backend
    ports:
      - "8000:8000"
    env_file:
      - ./src/backend/.env                 # bí mật ở NGOÀI image (đúng NFR-Security)
    environment:
      # Ghi đè: trong mạng compose, Postgres tên là `db` (không phải localhost)
      DATABASE_URL: postgresql+psycopg://postgres:meoarc_local@db:5432/meoarc
      # ── Chạy nhiều tiến trình (NFR scale-out) ────────────────────────────
      # WEB_CONCURRENCY phải KHỚP số worker thực tế của uvicorn: trần gọi ra ngoài
      # (32 suất Gmail, 6 suất LLM) nằm TRONG từng tiến trình, nên app đọc số này
      # để chia đều. Khai sai thành 1 mà chạy 4 worker thì tổng thành 4×32 = 128
      # kết nối — vượt gấp bốn ý định và vẫn khiến Gmail trả 429.
      # Nhiều worker thì BẮT BUỘC đặt REDIS_URL (uncomment dịch vụ redis bên dưới),
      # nếu không mỗi worker giữ cache và bộ đếm rate-limit riêng → đếm sai.
      WEB_CONCURRENCY: 1
      # REDIS_URL: redis://redis:6379/0   # bật cùng `--profile redis`
    depends_on:
      db:
        condition: service_healthy
    healthcheck:                       # tận dụng /health (NFR-Reliability) làm mạch đập
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./src/frontend
      args:
        # Trình duyệt của NGƯỜI DÙNG gọi thẳng backend qua cổng publish → giữ localhost:8000
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"                      # giữ thói quen cũ: mở http://localhost:5173
    depends_on:
      backend:
        condition: service_healthy

  # Tuỳ chọn (NFR scale-out): bật bằng `--profile redis` + REDIS_URL trong backend/.env
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  meoarc_pgdata:
